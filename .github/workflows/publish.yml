# Publish to npmjs.org with OIDC trusted publishing.
#
# No NPM_TOKEN secret is involved: npm 11.5.1+ (Node 22.14+/24) trades the
# workflow's `id-token` for a short-lived publish credential, and npmjs.org
# checks it against the trusted publisher configured for this package:
#
#   Provider:   GitHub Actions
#   Owner:      halcyon6669
#   Repository: dsh-offline-market
#   Workflow:   publish.yml        (basename only, not the full path)
#   Environment: (leave blank)
#   Allowed actions: tick "npm publish" (direct publish) -- this workflow uses
#                    `npm publish`, not the staged-publish flow.
#
# Release flow: bump package.json version, commit, push a `v<version>` tag.
# For a brand-new package, add the trusted publisher on npmjs.com first
# (pending configs must complete their first publish within 2 days).

name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$expected" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${version}"
            exit 1
          fi
          echo "publishing ${version}"

      - name: Syntax check the bundle sources
        run: |
          set -euo pipefail
          node --check index.js
          node --check client.js

      - name: Run the offline unit checks
        run: node test-offline-market.cjs

      - name: Show what will be published
        run: npm pack --dry-run

      - name: Publish
        # Provenance is generated automatically for trusted publishing from a
        # public repo; the explicit flag is harmless and documents intent.
        run: npm publish --access public --provenance

      - name: Verify the release landed
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 20); do
            live="$(npm view "dsh-offline-market@${version}" version --prefer-online 2>/dev/null || true)"
            if [ "$live" = "$version" ]; then
              echo "dsh-offline-market@${version} is live"
              exit 0
            fi
            echo "attempt ${attempt}/20: registry says '${live:-<missing>}', retrying in 15s"
            sleep 15
          done
          echo "::warning::publish succeeded but registry never reported ${version} within 5 minutes"
          exit 1
